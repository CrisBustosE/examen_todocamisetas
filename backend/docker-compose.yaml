services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: todocamisetas_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    container_name: todocamisetas_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: todocamisetas_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todocamisetas
      MYSQL_USER: user_camisetas
      MYSQL_PASSWORD: pass_camisetas
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
